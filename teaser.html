  @keyframes drift{
    from{transform:scale(1.06) translate(0,0)}
    to{transform:scale(1.14) translate(-1.6%,1.1%)}
  }
  .mist{
    position:fixed;inset:-30%;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 42% 30% at 30% 62%, rgba(195,212,240,.055), transparent 70%),
      radial-gradient(ellipse 52% 36% at 74% 38%, rgba(142,151,166,.045), transparent 70%);
    animation:mist 65s ease-in-out infinite alternate;
  }
  @keyframes mist{
    from{transform:translate(-2.5%,0)}
    to{transform:translate(2.5%,1.8%)}
  }
  .veil{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 105% 80% at 50% 48%, transparent 22%, rgba(4,4,5,.93) 74%),
      linear-gradient(rgba(4,4,5,.68), rgba(4,4,5,.46) 55%, rgba(4,4,5,.90));
  }
  main{
    position:relative;z-index:1;flex:1;text-align:center;padding:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .mark{margin-bottom:72px}
  .wm{
    font-family:'Manrope';font-weight:800;color:var(--text);
    font-size:clamp(38px,7vw,58px);letter-spacing:-1.5px;line-height:1;
  }
  .line{margin-top:16px;font-size:14px;color:var(--dim);font-weight:400;letter-spacing:.3px}
  .lower{
    position:relative;z-index:1;text-align:center;padding:0 24px 34px;
    display:flex;flex-direction:column;align-items:center;gap:11px;
  }
  .date{
    font-family:'Manrope';font-weight:700;font-size:13px;
    color:var(--soft);letter-spacing:5px;
  }
  .count{
    font-size:10.5px;color:var(--faint);letter-spacing:3px;
    font-variant-numeric:tabular-nums;text-transform:uppercase;
  }
  footer{
    position:relative;z-index:1;text-align:center;padding:0 24px 30px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .venue{font-size:10.5px;letter-spacing:3px;color:var(--faint);text-transform:uppercase}
  .brandline{display:flex;align-items:center;gap:14px;opacity:.7}
  .brandline img.a49{height:22px}
  .brandline img.fam{height:9px}
  .brandline .x{color:var(--faint);font-size:10px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  main>*, footer>*{animation:fadeUp 1.1s ease both}
  main>*:nth-child(2){animation-delay:.25s}
  main>*:nth-child(3){animation-delay:.5s}
  .lower>*{animation:fadeUp 1.1s ease both;animation-delay:.85s}
  .lower>*:nth-child(2){animation-delay:1s}
  footer>*{animation-delay:1.2s}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

      Math.floor(d/86400000) + ' days · ' + p(Math.floor(d/3600000)%24) + ' : ' + p(Math.floor(d/60000)%60) + ' : ' + p(Math.floor(d/1000)%60);
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
